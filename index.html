<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f4f3; --surface: #ffffff; --ink: #17211d; --muted: #67736e; --faint: #9aa5a0;
    --line: #e2e7e4; --track: #e4e9e6; --ok: #2f7a57; --ahead: #c98a12; --over: #c2412f;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101614; --surface: #19211e; --ink: #edf2ef; --muted: #9eaaa5; --faint: #6c7873;
            --line: #26302c; --track: #2a3430; --ok: #5cbf8d; --ahead: #e8b04a; --over: #f07a66; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.4 "Schibsted Grotesk", -apple-system, system-ui, sans-serif;
         font-variant-numeric: tabular-nums;
         padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Header: period + navigation */
  header { padding: 16px 20px 6px; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav .logo { width: 30px; height: 30px; flex: none; margin-right: 8px; cursor: pointer; }
  .setup { padding: 24px 20px; }
  .setup h2 { font-size: 24px; margin: 0 0 6px; }
  .setup p { color: var(--muted); margin: 0 0 18px; }
  .updating { height: 0; overflow: hidden; text-align: center; font-size: 12px; color: var(--faint); transition: height .15s; }
  .updating.show { height: 18px; }
  button { touch-action: manipulation; }
  .daygroup { content-visibility: auto; contain-intrinsic-size: auto 260px; }
  [hidden] { display: none !important; }
  .nav h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; }
  .nav button { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; font-size: 22px; line-height: 1; color: var(--muted); }
  .nav button:disabled { opacity: .3; }
  .seg { display: flex; background: var(--track); border-radius: 12px; padding: 3px; margin-top: 10px; }
  .seg button { flex: 1; border: 0; background: none; padding: 7px 0; border-radius: 9px; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .custom { display: none; gap: 8px; margin-top: 10px; align-items: center; }
  .custom.show { display: flex; }
  .custom input { flex: 1; min-width: 0; padding: 10px; border: 0; border-radius: 10px; background: var(--surface); font-size: 16px; }

  /* Hero: what's left */
  .hero { padding: 22px 20px 8px; }
  .hero .big { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .hero .big.over { color: var(--over); }
  .hero .what { font-size: 17px; color: var(--muted); margin-top: 2px; }
  .hero .meter { height: 10px; background: var(--track); border-radius: 5px; margin-top: 16px; position: relative; overflow: hidden; }
  .hero .meter span { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 5px; }
  .hero .meter.over span { background: var(--over); }
  .hero .meter i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bg); }
  .hero .foot { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 8px; }

  main { padding: 0 12px; }
  .group { background: var(--surface); border-radius: var(--radius); margin: 14px 0; padding: 4px 0; }
  .group h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0; padding: 12px 16px 2px; }

  /* Category rows */
  .cat { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 16px; }
  .cat + .cat { border-top: 1px solid var(--line); }
  .cat .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .cat .name { font-weight: 500; }
  .cat .left { font-weight: 600; white-space: nowrap; }
  .cat .left small { font-weight: 400; color: var(--muted); font-size: 14px; }
  .cat.over .left { color: var(--over); }
  .cat .bar { height: 6px; background: var(--track); border-radius: 3px; margin-top: 8px; position: relative; overflow: hidden; }
  .cat .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ok); }
  .cat.ahead .bar span { background: var(--ahead); }
  .cat.over .bar span { background: var(--over); }
  .cat .bar i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
  .cat .sub { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .plain .top .left { font-weight: 500; }
  .cat.big { padding: 16px; }
  .cat.big .top .name { color: var(--muted); font-weight: 500; font-size: 15px; }
  .cat.big .top .of { color: var(--muted); font-size: 14px; }
  .cat.big .num { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-top: 4px; }
  .cat.big .num small { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .cat.big.over .num { color: var(--over); }
  .cat.big .bar { height: 8px; border-radius: 4px; margin-top: 10px; }
  .cat.big .bar span { border-radius: 4px; }
  .cat.big .sub { margin-top: 7px; }
  .cat.big.ahead .sub { color: var(--ahead); }
  .addlimit { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 14px 16px; color: var(--muted); border-top: 1px solid var(--line); }

  /* Transactions */
  .tools { display: flex; gap: 8px; padding: 8px 8px 0; }
  .tools select { flex: 1; min-width: 0; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--surface); }
  .tools button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--surface); font-weight: 500; }
  .tools button.on { background: var(--ink); color: var(--bg); }
  .count { font-size: 14px; color: var(--muted); padding: 10px 12px 0; }
  .tx { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 12px 16px; }
  .tx + .tx { border-top: 1px solid var(--line); }
  .tx .body { flex: 1; min-width: 0; }
  .tx .m { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .meta { font-size: 13px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .meta.review { color: var(--ahead); font-weight: 500; }
  .tx .amt { font-weight: 500; }
  .tx .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--faint); flex: none; display: grid; place-items: center; }
  .tx .box.on { background: var(--ink); border-color: var(--ink); }
  .tx .box.on::after { content: ""; width: 6px; height: 11px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .day { font-size: 13px; color: var(--muted); padding: 14px 16px 0; }

  /* Tab bar */
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface);
             border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 3; }
  nav.tabs button { flex: 1; border: 0; background: none; color: var(--faint); padding: 15px 0; font-weight: 600; }
  nav.tabs button.on { color: var(--ink); }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px;
           background: var(--ahead); color: #fff; font-size: 12px; line-height: 18px; }

  /* Bottom sheet */
  .sheet { position: fixed; inset: 0; background: rgba(10,16,13,.4); display: none; align-items: flex-end; z-index: 5; }
  .sheet.open { display: flex; }
  .panel { background: var(--surface); width: 100%; border-radius: 22px 22px 0 0;
           padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
  .panel h3 { margin: 0; font-size: 20px; font-weight: 600; }
  .panel .note { color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
  .field { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .input { width: 100%; padding: 12px; border-radius: 12px; border: 0; background: var(--track); font-size: 18px; margin-bottom: 14px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--muted); margin: -2px 0 16px; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--ink); }
  .actions { display: flex; gap: 10px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 600; background: var(--ink); color: var(--bg); }
  .btn.quiet { background: var(--track); color: var(--ink); }
  .btn:disabled { opacity: .5; }
  .textbtn { border: 0; background: none; padding: 14px 0 0; width: 100%; color: var(--muted); }
  .textbtn.danger { color: var(--over); }

  .bulk { position: fixed; left: 12px; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom)); display: none; gap: 10px; z-index: 4; }
  .bulk.show { display: flex; }
  .bulk .btn { box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 9px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 6; }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); text-align: center; padding: 28px 16px; }
</style>
</head>
<body>
<header>
  <div class="nav">
    <svg class="logo" id="logo" role="button" tabindex="0" aria-label="Settings" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="114" fill="#2f7a57"/><circle cx="256" cy="256" r="150" fill="none" stroke="#1f5a3f" stroke-width="52"/><path d="M256 106 A150 150 0 1 1 113.3 302.4" fill="none" stroke="#f2f4f3" stroke-width="52" stroke-linecap="round"/><circle cx="256" cy="256" r="38" fill="#f2f4f3"/></svg>
    <h1 id="title">Loading</h1>
    <button id="prev" aria-label="Previous period">‹</button>
    <button id="next" aria-label="Next period">›</button>
  </div>
  <div class="seg" id="periods" role="tablist"></div>
  <div class="custom" id="custom">
    <input type="date" id="cstart" aria-label="Start date">
    <input type="date" id="cend" aria-label="End date">
  </div>
</header>
<div class="updating" id="updating" aria-live="polite">Updating</div>
<div id="view"></div>
<nav class="tabs">
  <button id="tab-budget" class="on">Budget</button>
  <button id="tab-tx">Transactions</button>
</nav>
<div class="bulk" id="bulk"><button class="btn" id="bulkchange">Change category</button><button class="btn quiet" id="bulkcancel" style="flex:none;padding:14px 20px">Cancel</button></div>
<div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const money = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const whole = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 });
const fmt = v => money.format(v || 0);
const fmt0 = v => whole.format(Math.round(v || 0));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const PERIODS = [['week', 'Week'], ['month', 'Month'], ['quarter', '3 mo'], ['year', 'Year'], ['custom', 'Custom']];
const NO_LIMIT = /^Excluded|^Work:|^Needs review$/;
/* The Budget tab always shows these, in this order. [label shown, category name in the sheet] */
/* Default list; the sheet's Categories tab replaces it (and holds categories you add) */
const DEFAULT_MAIN = [['Groceries', 'Groceries'], ['Eating out', 'Eating out and takeout'], ['Shopping', 'Shopping'],
  ['Transportation', 'Transport'], ['Health', 'Health'], ['Travel', 'Travel'], ['Sports', 'Sports and fitness']];
let MAIN = DEFAULT_MAIN, MAIN_NAMES = new Set(MAIN.map(m => m[1]));
function useLayout(layout) {
  MAIN = layout && layout.length ? layout.map(c => [c.label || c.name, c.name]) : DEFAULT_MAIN;
  MAIN_NAMES = new Set(MAIN.map(m => m[1]));
}
const OTHER = 'Other', OTHER_FILTER = '__other';
const NOT_SPENDING = /^Excluded|^Work: reimbursable/;   // left out of the totals, same rule as the sheet
// Recurring bills stay out of Other, so Other only covers everyday extras
const FIXED = new Set(['Housing', 'Insurance', 'Phone, internet and subscriptions', 'Financing payments',
  'Family support', 'Parking', 'Bank fees and interest']);
const FIXED_FILTER = '__fixed';
const isOther = cat => !MAIN_NAMES.has(cat) && !NOT_SPENDING.test(cat) && !FIXED.has(cat);
const isFixed = cat => FIXED.has(cat) && !MAIN_NAMES.has(cat);
function labelOf(cat) {
  const m = MAIN.find(x => x[1] === cat);
  if (m) return m[0];
  if (cat === 'Needs review') return 'Needs a category';
  if (isFixed(cat)) return 'Fixed bill: ' + cat;
  return cat === OTHER ? OTHER : 'Other: ' + cat;
}

/* ---------- connection to the Google Sheet (Apps Script API) ---------- */
const CFG_KEY = 'budget.connection', CACHE_KEY = 'budget.cache.';
function getCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || null; } catch (e) { return null; } }
function setCfg(c) { try { c ? localStorage.setItem(CFG_KEY, JSON.stringify(c)) : localStorage.removeItem(CFG_KEY); } catch (e) {} }
const APP_VERSION = '11';
const VIEW_KEY = 'budget.view';   // the period you were looking at, kept between visits
function saveView() {
  try { localStorage.setItem(VIEW_KEY, JSON.stringify({ period, start: $('cstart').value, end: $('cend').value, tab, catFilter })); } catch (e) {}
}
function savedView() { try { return JSON.parse(localStorage.getItem(VIEW_KEY)) || null; } catch (e) { return null; } }
function cacheGet(k) { try { return JSON.parse(localStorage.getItem(CACHE_KEY + k)); } catch (e) { return null; } }
function cacheSet(k, v, json) {
  try {
    localStorage.setItem(CACHE_KEY + k, json || JSON.stringify(v));
    // keep only the 10 most recently used periods so storage never fills up
    const order = (JSON.parse(localStorage.getItem(CACHE_KEY + '_order')) || []).filter(x => x !== k);
    order.unshift(k);
    order.slice(10).forEach(x => localStorage.removeItem(CACHE_KEY + x));
    localStorage.setItem(CACHE_KEY + '_order', JSON.stringify(order.slice(0, 10)));
  } catch (e) {}
}

async function call(method, payload) {
  const cfg = getCfg();
  if (!cfg) throw new Error('Not connected');
  let res;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  try {
    if (method === 'GET') {
      const qs = new URLSearchParams(Object.assign({ key: cfg.k }, payload)).toString();
      res = await fetch(cfg.u + '?' + qs, { redirect: 'follow', signal: ctl.signal });
    } else {
      res = await fetch(cfg.u, { method: 'POST', redirect: 'follow', signal: ctl.signal,
                                 headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                 body: JSON.stringify(Object.assign({ key: cfg.k }, payload)) });
    }
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'The sheet took too long to answer' : 'No connection');
  } finally {
    clearTimeout(timer);
  }
  const out = await res.json().catch(() => { throw new Error('No answer from the sheet. Check the web app URL.'); });
  if (!out.ok) throw new Error(out.error || 'Something went wrong');
  return out.data;
}
/* A small chain-style wrapper: server().withSuccessHandler(f).withFailureHandler(g).getDashboard(...) */
function server() {
  let ok = () => {}, fail = () => {};
  const api = {
    withSuccessHandler(f) { ok = f; return api; },
    withFailureHandler(f) { fail = f; return api; },
    getDashboard(start, end) { call('GET', { action: 'dashboard', start, end }).then(ok, fail); },
    setLimit(category, value) { call('POST', { action: 'setLimit', category, value }).then(ok, fail); },
    setCategories(items, category, always) { call('POST', { action: 'setCategories', items, category, always }).then(ok, fail); },
    addCategory(name, label) { call('POST', { action: 'addCategory', name, label }).then(ok, fail); },
    removeCategory(name) { call('POST', { action: 'removeCategory', name }).then(ok, fail); },
  };
  return api;
}

let data = null, tab = 'budget', period = 'month', anchor = null, lastRange = ['', ''];
let catFilter = '', selecting = false, selected = new Set();

/* ---------- dates ---------- */
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const lastOfMonth = (y, m) => new Date(y, m + 1, 0);
function range(p, a) {
  const y = a.getFullYear(), m = a.getMonth();
  if (p === 'week') { const s = new Date(a); s.setDate(a.getDate() - ((a.getDay() + 6) % 7)); const e = new Date(s); e.setDate(s.getDate() + 6); return [s, e]; }
  if (p === 'month') return [new Date(y, m, 1), lastOfMonth(y, m)];
  if (p === 'quarter') return [new Date(y, m - 2, 1), lastOfMonth(y, m)];
  return [new Date(y, 0, 1), new Date(y, 11, 31)];
}
function shift(p, a, dir) {
  const d = new Date(a);
  if (p === 'week') d.setDate(d.getDate() + 7 * dir);
  if (p === 'month') d.setMonth(d.getMonth() + dir, 1);
  if (p === 'quarter') d.setMonth(d.getMonth() + 3 * dir, 1);
  if (p === 'year') d.setFullYear(d.getFullYear() + dir, 0, 1);
  return d;
}
const F_SHORT = new Intl.DateTimeFormat('en-CA', { month: 'short', day: 'numeric' });
const F_MONTH = new Intl.DateTimeFormat('en-CA', { month: 'long', year: 'numeric' });
const F_MON = new Intl.DateTimeFormat('en-CA', { month: 'short' });
const F_MON_Y = new Intl.DateTimeFormat('en-CA', { month: 'short', year: 'numeric' });
const F_DAY = new Intl.DateTimeFormat('en-CA', { weekday: 'long', month: 'long', day: 'numeric' });
const F_MD = new Intl.DateTimeFormat('en-CA', { month: 'long', day: 'numeric' });
const short = d => F_SHORT.format(d);
function label(start, end) {
  const s = parse(start), e = parse(end);
  if (period === 'month') return F_MONTH.format(s);
  if (period === 'year') return String(s.getFullYear());
  if (period === 'quarter') return F_MON.format(s) + ' to ' + F_MON_Y.format(e);
  return short(s) + ' to ' + short(e) + ', ' + e.getFullYear();
}

/* Bank descriptions are shouty: "METRO 758 TORONTO ON" -> "Metro" */
const PLACES = /\b(TORONTO|NORTH YORK|EAST YORK|SCARBOROUGH|ETOBICOKE|MISSISSAUGA|MARKHAM|MONTREAL|LAVAL|SAINT-LAURENT|SHERBROOKE|OTTAWA|VANCOUVER|HALIFAX|KINGSTON|OAKVILLE|BRAMPTON)\b.*$/i;
const ALIASES = [[/AMZN|AMAZON(?!.*PRIME)/i, 'Amazon'], [/AMAZON.*PRIME/i, 'Amazon Prime'], [/UBER ?EATS/i, 'Uber Eats'],
  [/UBER ?TRIP/i, 'Uber'], [/^PRESTO/i, 'Presto'], [/APPLE\.COM/i, 'Apple'], [/^GOOGLE \*/i, 'Google'], [/SB M-WING/i, 'Sunnybrook cafeteria']];
function tidy(m) {
  if (!m) return '';
  if (/^e-Transfer/.test(m)) return m;
  const alias = ALIASES.find(a => a[0].test(m));
  if (alias) return alias[1];
  let s = m.replace(/^(SQ|TST)\s*[\*-]\s*/i, '').replace(PLACES, '').replace(/\s+[A-Z]{2}$/, '')
           .replace(/[#*].*$/, '').replace(/\s\d{2,}\S*.*$/, '').replace(/\s+/g, ' ').trim();
  if (!s) s = m;
  return s.toLowerCase().replace(/(^|[\s\-\/&(.'])([a-zà-ÿ])/g, (x, p, c) => p + c.toUpperCase());
}
const tidyMemo = new Map();
const txName = t => {
  if (!t.merchant) return 'Withdrawal';
  let n = tidyMemo.get(t.merchant);
  if (n === undefined) { n = tidy(t.merchant); tidyMemo.set(t.merchant, n); }
  return n;
};

/* ---------- loading ---------- */
let requestId = 0, lastFetch = 0, dataJson = '';
function load(start, end) {
  lastRange = [start, end];
  const id = ++requestId;                    // only the newest request may update the screen
  const key = (start || 'current') + '|' + (end || '');
  const cachedJson = (() => { try { return localStorage.getItem(CACHE_KEY + key); } catch (e) { return null; } })();
  if (cachedJson) { setData(JSON.parse(cachedJson), cachedJson, true); }   // show the last copy instantly
  else { $('title').textContent = 'Loading'; showUpdating(true); }
  server().withSuccessHandler(d => {
    if (id !== requestId) return;
    lastFetch = Date.now();
    const json = JSON.stringify(d);
    cacheSet(key, d, json);
    if (json === dataJson) return showUpdating(false);   // nothing changed: no redraw
    setData(d, json, false);
  }).withFailureHandler(err => {
    if (id !== requestId) return;
    showUpdating(false);
    if (/Wrong key|No key|Not connected/.test(err.message)) return setupView(err.message);
    if (data) return toast((err.message || 'No connection') + '. Showing the last saved numbers.');
    $('title').textContent = 'Budget';
    $('view').innerHTML = '<p class="empty">' + esc(err.message || err) + '</p>';
    built = false;
  }).getDashboard(start || '', end || '');
}
function setData(d, json, stale) {
  data = d; dataJson = json;
  useLayout(d.layout);
  if (!anchor) anchor = parse(d.today);
  renderAll();
  showUpdating(stale);
}
function loadPeriod() { const [s, e] = range(period, anchor); load(iso(s), iso(e)); }
const reload = () => load(lastRange[0], lastRange[1]);
let toastTimer = 0;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function showUpdating(on) { $('updating').classList.toggle('show', !!on); }

/* ---------- render ----------
   Both tabs are built once per data load and kept in the page;
   switching tabs only shows one and hides the other. */
let built = false;
function ensureShell() {
  if (built) return;
  $('view').innerHTML = '<div id="vbudget"></div><div id="vtx" hidden></div>';
  built = true;
}
function renderHeader() {
  $('periods').style.display = ''; $('prev').style.visibility = $('next').style.visibility = '';
  $('title').textContent = label(data.start, data.end);
  $('prev').disabled = period === 'custom';
  $('next').disabled = period === 'custom' || data.end >= data.today;
  $('periods').innerHTML = PERIODS.map(p => '<button role="tab" data-p="' + p[0] + '" class="' + (p[0] === period ? 'on' : '') + '">' + p[1] + '</button>').join('');
  $('custom').classList.toggle('show', period === 'custom');
  $('tab-tx').innerHTML = 'Transactions' + (data.needsReview ? '<span class="badge">' + data.needsReview + '</span>' : '');
}
function renderAll() {
  ensureShell();
  renderHeader();
  $('vbudget').innerHTML = budgetView();
  $('vtx').innerHTML = txView();
  showTab();
}
function renderTx() { if (data) { $('vtx').innerHTML = txView(); updateBulk(); } }
function showTab() {
  if (!built) return;
  $('vbudget').hidden = tab !== 'budget';
  $('vtx').hidden = tab !== 'tx';
  $('tab-budget').className = tab === 'budget' ? 'on' : '';
  $('tab-tx').className = tab === 'tx' ? 'on' : '';
  updateBulk();
}
function updateBulk() {
  $('bulk').classList.toggle('show', tab === 'tx' && selecting);
  $('bulkchange').textContent = selected.size ? 'Change category of ' + selected.size : 'Tick transactions to change';
}

/* The eight fixed rows: seven named categories, then everything else added up as Other */
function displayCategories() {
  const byName = new Map(data.categories.map(c => [c.name, c]));
  const share = data.isCurrent ? data.elapsed / data.days : (data.today > data.end ? 1 : 0);
  const round = v => Math.round(v * 100) / 100;
  const rows = MAIN.map(([label, name]) => {
    const c = byName.get(name) || { spent: 0, limit: null, monthlyLimit: null, state: 'none', pace: null };
    return { key: name, label, spent: c.spent, limit: c.limit, monthlyLimit: c.monthlyLimit, state: c.state, pace: c.pace };
  });
  const parts = data.categories.filter(c => isOther(c.name) && c.spent);
  const o = byName.get(OTHER) || { limit: null, monthlyLimit: null };
  const spent = round(parts.reduce((a, c) => a + c.spent, 0));
  let state = 'none';
  if (o.limit !== null) state = spent > o.limit ? 'over' : (data.isCurrent && spent > o.limit * Math.min(1, share + 0.1) ? 'ahead' : 'ok');
  rows.push({ key: OTHER, label: OTHER, spent, limit: o.limit, monthlyLimit: o.monthlyLimit, state,
              pace: o.limit !== null ? round(o.limit * share) : null, parts: parts.sort((a, b) => b.spent - a.spent) });
  return rows;
}

function budgetView() {
  let h = '<main style="padding-top:4px"><div class="group">' + displayCategories().map(c => c.limit !== null ? limitRow(c) : plainRow(c)).join('') +
          '<button class="addlimit" data-act="addcat">+ Add a category</button></div>';
  const fixed = data.categories.filter(c => FIXED.has(c.name) && !MAIN_NAMES.has(c.name)).reduce((a, c) => a + c.spent, 0);
  h += '<p class="empty" style="padding-top:4px;font-size:14px">' +
       (fixed ? 'Fixed bills (rent, hydro, insurance, phone, family support…) are not shown: ' + fmt0(fixed) + ' in this period. ' : '') +
       'Tap a category to set its monthly limit or see its purchases.' +
       (data.factor !== 1 ? ' Limits are set per month; ' + (Number.isInteger(data.factor) ? 'this view adds up ' + data.factor + ' of them.' : 'this view uses the share for ' + data.days + ' days.') : '') + '</p>';
  return h + '</main>';
}

function limitRow(c) {
  const left = c.limit - c.spent;
  const pct = c.limit > 0 ? Math.min(100, c.spent / c.limit * 100) : 100;
  const pace = data.isCurrent && c.limit > 0 && c.pace !== null ? Math.min(100, c.pace / c.limit * 100) : null;
  const num = c.state === 'over' ? fmt0(-left) + ' <small>over</small>' : fmt0(left) + ' <small>left</small>';
  const sub = c.state === 'ahead' ? 'Spending faster than planned'
            : c.state === 'over' ? ''
            : data.isCurrent ? (data.days - data.elapsed) + ' days to go' : '';
  return '<button class="cat big ' + c.state + '" data-act="cat" data-cat="' + esc(c.key) + '">' +
         '<div class="top"><span class="name">' + esc(c.label) + '</span><span class="of">' + fmt0(c.spent) + ' of ' + fmt0(c.limit) + '</span></div>' +
         '<div class="num">' + num + '</div>' +
         '<div class="bar"><span style="width:' + pct + '%"></span>' + (pace !== null && pace < 100 ? '<i style="left:' + pace + '%"></i>' : '') + '</div>' +
         (sub ? '<div class="sub">' + sub + '</div>' : '') + '</button>';
}
function plainRow(c) {
  return '<button class="cat plain" data-act="cat" data-cat="' + esc(c.key) + '"><div class="top"><span class="name">' + esc(c.label) +
         '</span><span class="left">' + fmt0(c.spent) + '</span></div><div class="sub">No limit</div></button>';
}

function txView() {
  const list = data.transactions.filter(t => !catFilter ||
    (catFilter === OTHER_FILTER ? isOther(t.category) : catFilter === FIXED_FILTER ? isFixed(t.category) : t.category === catFilter));
  const filters = [['', 'All categories']].concat(MAIN.map(m => [m[1], m[0]]), [[OTHER_FILTER, 'Other'], [FIXED_FILTER, 'Fixed bills'], ['Needs review', 'Needs a category']]);
  let h = '<main><div class="tools"><select id="catfilter" aria-label="Category">' +
          filters.map(f => '<option value="' + esc(f[0]) + '"' + (f[0] === catFilter ? ' selected' : '') + '>' + esc(f[1]) + '</option>').join('') +
          '</select><button data-act="select" class="' + (selecting ? 'on' : '') + '">' + (selecting ? 'Done' : 'Select') + '</button></div>';
  h += '<div class="count">' + list.length + (list.length === 1 ? ' transaction, ' : ' transactions, ') + fmt(list.reduce((a, t) => a + t.amount, 0)) + '</div>';
  if (!list.length) return h + '<p class="empty">No transactions in this period.</p></main>';
  let day = '', open = false;
  list.forEach(t => {
    const d = t.date.slice(0, 10);
    if (d !== day) {
      if (open) h += '</div>';
      h += '<div class="day">' + F_DAY.format(parse(d)) + '</div><div class="group daygroup">';
      day = d; open = true;
    }
    const review = t.category === 'Needs review';
    h += '<button class="tx" data-act="tx" data-row="' + t.row + '"' + (selecting && selected.has(t.row) ? ' aria-pressed="true"' : '') + '>' +
         (selecting ? '<span class="box' + (selected.has(t.row) ? ' on' : '') + '"></span>' : '') +
         '<span class="body"><div class="m">' + esc(txName(t)) + '</div>' +
         '<div class="meta' + (review ? ' review' : '') + '">' + esc(labelOf(t.category)) + ', ' + esc(t.person) + '</div></span>' +
         '<span class="amt">' + fmt(t.amount) + '</span></button>';
  });
  return h + '</div></main>';
}

/* ---------- sheets ---------- */
function openSheet(html) { $('panel').innerHTML = html; $('sheet').classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); }

function categorySheet(key) {
  const c = displayCategories().find(x => x.key === key);
  if (!c) return;
  const breakdown = c.parts && c.parts.length
    ? '<div style="margin:-6px 0 16px">' + c.parts.map(p => '<div class="top" style="display:flex;justify-content:space-between;font-size:15px;padding:3px 0"><span>' +
        esc(p.name === 'Needs review' ? 'Needs a category' : p.name) + '</span><span>' + fmt0(p.spent) + '</span></div>').join('') + '</div>'
    : '';
  openSheet('<h3>' + esc(c.label) + '</h3><p class="note">' + fmt(c.spent) + ' spent in this period' +
    (c.limit !== null ? ', limit ' + fmt(c.limit) : '') + (c.parts ? '. Everything outside the categories above, except fixed bills:' : '') + '</p>' + breakdown +
    '<label class="field" for="lim">Monthly limit</label>' +
    '<input class="input" id="lim" type="number" inputmode="decimal" min="0" step="10" placeholder="No limit" value="' + (c.monthlyLimit ?? '') + '">' +
    '<div class="actions"><button class="btn" id="limsave">Save limit</button><button class="btn quiet" id="seetx">See purchases</button></div>' +
    (c.monthlyLimit !== null ? '<button class="textbtn danger" id="limremove">Remove limit</button>' : '') +
    (key !== OTHER ? '<button class="textbtn" id="catremove">Take ' + esc(c.label) + ' off this list</button>' : ''));
  if ($('catremove')) $('catremove').onclick = e => {
    if (!confirmOnce(e.currentTarget, 'Tap again to confirm. Its purchases will count in Other.')) return;
    e.currentTarget.disabled = true;
    server().withSuccessHandler(() => { closeSheet(); toast(c.label + ' taken off the list'); reload(); })
      .withFailureHandler(err => { e.currentTarget.disabled = false; toast(friendly(err)); }).removeCategory(key);
  };
  $('seetx').onclick = () => {
    closeSheet(); catFilter = key === OTHER ? OTHER_FILTER : key; tab = 'tx';
    renderTx(); showTab(); saveView(); window.scrollTo(0, 0);
  };
  const save = (value, btn, done) => {
    btn.disabled = true;
    server().withSuccessHandler(() => { closeSheet(); toast(done); reload(); })
      .withFailureHandler(err => { btn.disabled = false; toast(err.message); }).setLimit(key, value);
  };
  $('limsave').onclick = e => { const v = $('lim').value.trim(); if (v === '') return toast('Enter an amount, or remove the limit'); save(v, e.currentTarget, 'Limit saved'); };
  if ($('limremove')) $('limremove').onclick = e => save('', e.currentTarget, 'Limit removed');
}

/* A button that asks for a second tap instead of a pop-up dialog */
function confirmOnce(btn, text) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.textContent = text; btn.classList.add('danger');
  return false;
}
function friendly(err) {
  return /Unknown action/.test(err.message) ? 'Update Api.gs in Apps Script first (see the setup notes)' : err.message;
}

function addCategorySheet() {
  const unused = data.categoryOptions.filter(c => !MAIN_NAMES.has(c) && !NOT_SPENDING.test(c) && c !== 'Needs review' && c !== OTHER);
  openSheet('<h3>Add a category</h3><p class="note">It appears on the Budget tab just above Other. ' +
    'Pick one your purchases already use, or create a new one and move purchases into it.</p>' +
    '<label class="field" for="acpick">Category</label><select class="input" id="acpick">' +
    unused.map(c => '<option value="' + esc(c) + '">' + esc(c) + (FIXED.has(c) ? ' (fixed bill)' : '') + '</option>').join('') +
    '<option value="__new"' + (unused.length ? '' : ' selected') + '>New category…</option></select>' +
    '<input class="input" id="acnew" placeholder="Name, for example Kids or Gifts" maxlength="40" style="display:' + (unused.length ? 'none' : 'block') + ';margin-top:-6px">' +
    '<label class="field" for="aclim">Monthly limit (optional)</label>' +
    '<input class="input" id="aclim" type="number" inputmode="decimal" min="0" step="10" placeholder="No limit">' +
    '<div class="actions"><button class="btn" id="acsave">Add category</button><button class="btn quiet" id="accancel">Cancel</button></div>');
  $('acpick').onchange = () => { const n = $('acpick').value === '__new'; $('acnew').style.display = n ? 'block' : 'none'; if (n) $('acnew').focus(); };
  $('accancel').onclick = closeSheet;
  $('acsave').onclick = e => {
    const name = $('acpick').value === '__new' ? $('acnew').value.trim() : $('acpick').value;
    const limit = $('aclim').value.trim();
    if (!name) return toast('Enter a name');
    const btn = e.currentTarget; btn.disabled = true;
    const fail = err => { btn.disabled = false; toast(friendly(err)); };
    server().withSuccessHandler(() => {
      const done = () => { closeSheet(); toast(name + ' added'); reload(); };
      if (limit === '') return done();
      server().withSuccessHandler(done).withFailureHandler(fail).setLimit(name, limit);
    }).withFailureHandler(fail).addCategory(name, name);
  };
}

function recategorizeSheet(rows) {
  const items = rows.map(r => data.transactions.find(x => x.row === r));
  const single = items.length === 1, first = items[0];
  const current = single ? first.category : '';
  const known = MAIN_NAMES.has(current) || data.categoryOptions.indexOf(current) >= 0;
  const merchants = Array.from(new Set(items.map(t => t.merchant).filter(Boolean)));
  const when = single ? F_MD.format(parse(first.date.slice(0, 10))) : '';
  openSheet('<h3>' + (single ? esc(txName(first)) : items.length + ' transactions') + '</h3>' +
    '<p class="note">' + fmt(items.reduce((a, t) => a + t.amount, 0)) + (single ? ', ' + when + ', ' + esc(first.person) : '') +
    (single && first.merchant ? '<br>' + esc(first.merchant) : '') + '</p>' +
    '<label class="field" for="rc">Category</label><select class="input" id="rc">' +
    (known ? '' : '<option value="" disabled selected>Choose a category</option>') +
    MAIN.map(m => '<option value="' + esc(m[1]) + '"' + (m[1] === current ? ' selected' : '') + '>' + esc(m[0]) + '</option>').join('') +
    '<optgroup label="Fixed bills">' +
    data.categoryOptions.filter(c => isFixed(c)).map(c => '<option value="' + esc(c) + '"' + (c === current ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
    '</optgroup><optgroup label="Other">' +
    data.categoryOptions.filter(c => !MAIN_NAMES.has(c) && !FIXED.has(c)).map(c => '<option value="' + esc(c) + '"' + (c === current ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
    '<option value="__new">New category…</option></optgroup></select>' +
    '<input class="input" id="rcnew" placeholder="Name of the new category" style="display:none;margin-top:-6px">' +
    (merchants.length ? '<label class="check"><input type="checkbox" id="always"> Use this category for future purchases at ' +
      (merchants.length === 1 ? esc(tidy(merchants[0])) : 'these ' + merchants.length + ' places') + '</label>' : '') +
    '<div class="actions"><button class="btn" id="rcsave">Save</button><button class="btn quiet" id="rccancel">Cancel</button></div>');
  $('rc').onchange = () => { const n = $('rc').value === '__new'; $('rcnew').style.display = n ? 'block' : 'none'; if (n) $('rcnew').focus(); };
  $('rccancel').onclick = closeSheet;
  $('rcsave').onclick = e => {
    const cat = $('rc').value === '__new' ? $('rcnew').value.trim() : $('rc').value;
    if (!cat) return toast('Choose a category');
    const always = !!($('always') || {}).checked;
    e.currentTarget.disabled = true;
    server().withSuccessHandler(() => { closeSheet(); selecting = false; selected.clear(); updateBulk(); toast('Saved'); reload(); })
      .withFailureHandler(err => { e.currentTarget.disabled = false; toast(err.message); })
      .setCategories(items.map(t => ({ row: t.row, id: t.id })), cat, always);
  };
}

/* ---------- events (one listener each, so nothing is re-attached on redraw) ---------- */
function choosePeriod(p) {
  if (!data) return;
  period = p;
  if (p === 'custom') {
    if (!$('cstart').value) { $('cstart').value = data.start; $('cend').value = data.end; }
    renderHeader();
    applyCustom();
    return;
  }
  anchor = parse(data.today); saveView(); loadPeriod();
}
$('periods').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (b) choosePeriod(b.dataset.p); });
$('view').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !data) return;
  const a = el.dataset.act;
  if (a === 'cat') categorySheet(el.dataset.cat);
  if (a === 'addcat') addCategorySheet();
  if (a === 'select') { selecting = !selecting; selected.clear(); renderTx(); }
  if (a === 'tx') {
    const row = Number(el.dataset.row);
    if (!selecting) return recategorizeSheet([row]);
    const on = !selected.has(row);
    on ? selected.add(row) : selected.delete(row);
    const box = el.querySelector('.box'); if (box) box.classList.toggle('on', on);   // no full redraw
    updateBulk();
  }
});
$('view').addEventListener('change', e => {
  if (e.target.id === 'catfilter') { catFilter = e.target.value; selected.clear(); renderTx(); saveView(); }
});
$('sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('prev').onclick = () => { if (!anchor) return; anchor = shift(period, anchor, -1); loadPeriod(); };
$('next').onclick = () => { if (!anchor) return; anchor = shift(period, anchor, 1); loadPeriod(); };
// A custom range applies (and is remembered) as soon as a date is picked: no button to forget
function applyCustom() {
  const s = $('cstart').value, e = $('cend').value;
  if (!s || !e) return;
  if (s > e) return toast('The start date is after the end date');
  period = 'custom';
  saveView();
  if (!data || data.start !== s || data.end !== e || lastRange[0] !== s || lastRange[1] !== e) load(s, e);
}
// iPhone date pickers do not always send "change" before you leave, so listen to every signal
['input', 'change', 'blur'].forEach(ev => {
  $('cstart').addEventListener(ev, applyCustom);
  $('cend').addEventListener(ev, applyCustom);
});
// Save where you are whenever the app goes to the background or closes
function saveOnLeave() {
  if (!getCfg()) return;
  if (period === 'custom') {
    const s = $('cstart').value, e = $('cend').value;
    if (!s || !e || s > e) return;
  }
  saveView();
}
window.addEventListener('pagehide', saveOnLeave);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveOnLeave(); });
$('tab-budget').onclick = () => {
  if (tab === 'budget') return;
  tab = 'budget';
  if (selecting) { selecting = false; selected.clear(); renderTx(); }
  showTab(); saveView(); window.scrollTo(0, 0);
};
$('tab-tx').onclick = () => { if (tab === 'tx') return; tab = 'tx'; showTab(); saveView(); window.scrollTo(0, 0); };
$('bulkchange').onclick = () => { if (!selected.size) return toast('Tick at least one transaction'); recategorizeSheet(Array.from(selected)); };
$('bulkcancel').onclick = () => { selecting = false; selected.clear(); renderTx(); };
/* ---------- first-time setup and settings ---------- */
function setupView(problem) {
  $('title').textContent = 'Budget';
  $('periods').style.display = 'none'; $('custom').classList.remove('show');
  $('prev').style.visibility = $('next').style.visibility = 'hidden';
  built = false; data = null; dataJson = ''; showUpdating(false); $('bulk').classList.remove('show');
  $('view').innerHTML = '<div class="setup"><h2>Connect your sheet</h2><p>' +
    (problem && problem !== 'Not connected' ? esc(problem) + '. ' : '') +
    'Paste the web app URL and the key from Apps Script, or paste a setup link in the first box. You only do this once on each phone.</p>' +
    '<label class="field" for="su">Web app URL or setup link</label><input class="input" id="su" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">' +
    '<label class="field" for="sk">Key</label><input class="input" id="sk" autocapitalize="off" autocorrect="off">' +
    '<button class="btn" style="width:100%" id="sgo">Connect</button></div>';
  const cfg = getCfg(); if (cfg) { $('su').value = cfg.u; $('sk').value = cfg.k; }
  $('sgo').onclick = e => {
    let u = $('su').value.trim(), k = $('sk').value.trim();
    const link = u.match(/#connect=(.+)$/);        // a setup link pasted in the URL box also works
    if (link) { try { const c = JSON.parse(atob(link[1].replace(/-/g, '+').replace(/_/g, '/'))); u = c.u; k = c.k; } catch (err) {} }
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return toast('The URL should end in /exec');
    if (!k) return toast('Paste the key');
    e.currentTarget.disabled = true;
    setCfg({ u, k });
    call('GET', { action: 'ping' }).then(() => { toast('Connected'); anchor = null; period = 'month'; load('', ''); },
      err => { e.currentTarget.disabled = false; toast(err.message); });
  };
}
function setupLink() {
  const cfg = getCfg();
  const token = btoa(JSON.stringify(cfg)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.origin + location.pathname + '#connect=' + token;
}
function settingsSheet() {
  if (!getCfg()) return;
  openSheet('<h3>Settings</h3><p class="note">To set up Aleksandra\'s phone, send her this link. She adds Budget to her home screen, opens it, and pastes the link in the first box. It contains your key, so only share it with her.</p>' +
    '<div class="actions"><button class="btn" id="copylink">Copy setup link</button><button class="btn quiet" id="refresh">Refresh now</button></div>' +
    '<button class="textbtn danger" id="disconnect">Disconnect this phone</button>' +
    '<p class="note" style="text-align:center;margin:12px 0 0">Version ' + APP_VERSION + '</p>');
  $('copylink').onclick = () => {
    const link = setupLink();
    (navigator.share ? navigator.share({ title: 'Budget', url: link }) : navigator.clipboard.writeText(link).then(() => toast('Link copied')))
      .catch(() => {});
  };
  $('refresh').onclick = () => { closeSheet(); reload(); };
  $('disconnect').onclick = () => { setCfg(null); try { localStorage.removeItem(VIEW_KEY); } catch (e) {} try { Object.keys(localStorage).filter(k => k.startsWith(CACHE_KEY)).forEach(k => localStorage.removeItem(k)); } catch (e) {} closeSheet(); setupView(); };
}
$('logo').onclick = settingsSheet;
$('logo').onkeydown = e => { if (e.key === 'Enter') settingsSheet(); };

/* A setup link (#connect=…) fills in the connection, then disappears from the address bar */
(function start() {
  const m = location.hash.match(/^#connect=(.+)$/);
  if (m) {
    try {
      const c = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
      if (c.u && c.k) setCfg({ u: c.u, k: c.k });
    } catch (e) {}
    history.replaceState(null, '', location.pathname);
  }
  if (!getCfg()) return setupView();
  const v = savedView();
  if (v && (v.tab === 'tx' || v.tab === 'budget')) tab = v.tab;
  if (v && typeof v.catFilter === 'string') catFilter = v.catFilter;
  // The last custom dates are kept even while another period is shown, so Custom brings them back
  if (v && v.start && v.end) { $('cstart').value = v.start; $('cend').value = v.end; }
  if (v && v.period === 'custom' && v.start && v.end) {
    period = 'custom';
    return load(v.start, v.end);
  }
  if (v && ['week', 'quarter', 'year'].indexOf(v.period) >= 0) {
    period = v.period; anchor = new Date(); return loadPeriod();
  }
  load('', '');
})();
// Coming back to the app refreshes the numbers, at most once a minute
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && getCfg() && data && Date.now() - lastFetch > 60000) reload();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
